name: CI (Windows Build, Tests & Static Analysis)

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify (JDK ${{ matrix.java }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Eclipse Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b1f521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run unit, integration, simulation tests, -Xlint and SpotBugs
        run: mvn -B clean verify
