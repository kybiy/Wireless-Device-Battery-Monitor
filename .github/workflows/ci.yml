name: CI (Windows Build, Tests & Static Analysis)

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify (JDK ${{ matrix.java }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Eclipse Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run unit, integration, simulation tests, -Xlint and SpotBugs
        run: mvn -B clean verify
